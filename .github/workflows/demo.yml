name: Demo data checks
on: [push, pull_request]
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Adapter syntax
        run: node --check demo/backend.js
      - name: Scale, hierarchy, references and local persistence
        run: node tests/scale.cjs
      - name: Training contracts, DNC and cumulative ROI
        run: node tests/training.cjs
      - run: node tests/dossier.cjs
      - run: node tests/plans.cjs
      - run: node tests/person-details.cjs
      - run: node tests/goals.cjs
      - run: node tests/evaluation-access.cjs
      - name: Projects module syntax and PHP bridge
        run: |
          node --check demo/projects.js
          php -l index.php
          php -l asset.php
          php tests/projects-bridge.php
      - name: Projects interactions and persistence
        run: |
          npm install --no-save --ignore-scripts jsdom@30.1.1
          node tests/projects.cjs
          node tests/projects-hybrid.cjs
      - name: Legacy demo entry routing
        run: node tests/entry-routing.cjs
